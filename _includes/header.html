<header class="page-header" role="banner">
  <h1 class="project-name">{{ site.title | default: site.github.repository_name }}</h1>
  <h2 class="project-tagline">{{ site.description | default: site.github.project_tagline }}</h2>
  
  <!-- Navigation Tabs -->
  <nav class="site-nav">
    <ul style="list-style: none; padding: 0; margin: 20px 0 0; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
      <!-- Home tab -->
      <li>
        <a href="{{ '/' | relative_url }}" class="btn {% if page.url == '/' %}btn-primary{% endif %}">
          Home
        </a>
      </li>
      
      <!-- About tab -->
      <li>
        <a href="{{ '/about' | relative_url }}" class="btn {% if page.url contains '/about' %}btn-primary{% endif %}">
          About
        </a>
      </li>
      
      <!-- Projects tab -->
      <li>
        <a href="{{ '/projects' | relative_url }}" class="btn {% if page.url contains '/projects' %}btn-primary{% endif %}">
          Projects
        </a>
      </li>
      
      <!-- Contact tab -->
      <li>
        <a href="{{ '/contact' | relative_url }}" class="btn {% if page.url contains '/contact' %}btn-primary{% endif %}">
          Contact
        </a>
      </li>
    </ul>
  </nav>
</header>
